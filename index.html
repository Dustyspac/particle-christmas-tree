function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296}}const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),TAU=Math.PI*2;function radiusAt(y){const f=clamp((y-c.tree.baseY)/c.tree.height);return c.tree.bottomRadius*Math.pow(1-f,1.04)*(.92+.08*Math.cos(f*c.tree.tierCount*Math.PI*2))}function randomSphere(r){const z=r()*2-1,a=r()*TAU,q=Math.sqrt(1-z*z);return[q*Math.cos(a),z,q*Math.sin(a)]}

function makeRibbon(){const r=rng(c.seed+2),a=[];for(let i=0;i<c.ribbon.particles;i++){const f=i/(c.ribbon.particles-1),y=c.tree.baseY+.22+f*(c.tree.height-.55),angle=TAU*c.ribbon.turns*f,rr=radiusAt(y)+c.ribbon.radiusOffset+(r()-.5)*c.ribbon.width,jitter=(r()-.5)*.035;a.push({p:[Math.cos(angle)*rr,y+jitter,Math.sin(angle)*rr],color:c.ribbon.color,birth:lerp(c.ribbon.start,c.ribbon.end,f),size:1.15+r()*1.25,phase:r()*TAU})}return a}
function makeOrnaments(){const r=rng(c.seed+3),a=[];for(let k=0;k<c.ornaments.spheres;k++){const f=.08+r()*.79,y=c.tree.baseY+f*c.tree.height,angle=r()*TAU,rr=radiusAt(y)*1.03,center=[Math.cos(angle)*rr,y,Math.sin(angle)*rr],rad=lerp(c.ornaments.radiusMin,c.ornaments.radiusMax,r()),color=c.ornaments.colors[k%c.ornaments.colors.length],start=lerp(c.ornaments.start,c.ornaments.end,k/c.ornaments.spheres);for(let i=0;i<c.ornaments.pointsPerSphere;i++){const v=randomSphere(r);a.push({p:center.map((p,j)=>p+v[j]*rad),color,birth:start+r()*.32,size:1.25+r()*.75,phase:r()*TAU})}}return a}
function makeStar(){const r=rng(c.seed+4),a=[],top=c.tree.baseY+c.tree.height+.13;for(let i=0;i<c.star.particles;i++){const ang=r()*TAU,outer=Math.cos(ang*5)>0?1:.53,rad=c.star.size*outer*Math.sqrt(r());a.push({p:[Math.cos(ang)*rad,top+Math.sin(ang)*rad,(r()-.5)*.11],color:r()<.8?0xffdf7e:0xfff6ca,birth:lerp(c.star.start,c.star.end,r()),size:1.2+r()*1.8,phase:r()*TAU})}return a}
function makeGifts(){const r=rng(c.seed+5),a=[];for(const gift of c.gifts.items){for(let i=0;i<c.gifts.pointsPerBox;i++){const side=Math.floor(r()*6),u=r()-.5,v=r()-.5,half=gift.size.map(x=>x/2);let p;if(side===0)p=[half[0],u*gift.size[1],v*gift.size[2]];else if(side===1)p=[-half[0],u*gift.size[1],v*gift.size[2]];else if(side===2)p=[u*gift.size[0],half[1],v*gift.size[2]];else if(side===3)p=[u*gift.size[0],-half[1],v*gift.size[2]];else if(side===4)p=[u*gift.size[0],v*gift.size[1],half[2]];else p=[u*gift.size[0],v*gift.size[1],-half[2]];const ribbon=(side===2||side===3)?Math.abs(p[0])<.065||Math.abs(p[2])<.065:(side===0||side===1)?Math.abs(p[2])<.065:Math.abs(p[0])<.065;a.push({p:p.map((x,j)=>x+gift.position[j]),color:ribbon?gift.ribbon:gift.color,birth:gift.time+r()*c.gifts.revealDuration,size:1+r()*.9,phase:r()*TAU})}const top=gift.position[1]+gift.size[1]/2;const cx=gift.position[0],cz=gift.position[2],w=gift.size[0],d=gift.size[2];const ribbonBirth=gift.time+.25;const addRibbon=(p,idx)=>a.push({p,color:gift.ribbon,birth:ribbonBirth+r()*c.gifts.revealDuration*.65,size:1.2+r()*.75,phase:r()*TAU});for(let n=0;n<350;n++){const t=r(),which=n%4,spread=(r()-.5)*.025;let p;if(which===0)p=[cx+(t-.5)*w,top+.015,cz+spread];else if(which===1)p=[cx+spread,top+.015,cz+(t-.5)*d];else if(which===2)p=[cx+(t-.5)*w,gift.position[1]+(r()-.5)*gift.size[1],cz+d/2+.006];else p=[cx+w/2+.006,gift.position[1]+(r()-.5)*gift.size[1],cz+(t-.5)*d];addRibbon(p,n)}for(let loop=0;loop<4;loop++){const alongX=loop<2,sign=loop%2===0?1:-1;for(let n=0;n<190;n++){const t=n/189,ang=TAU*t;const length=alongX?w*.34:d*.34;const reach=length*Math.sin(ang),height=Math.abs(Math.sin(ang*.5))*Math.min(w,d)*.33;const p=alongX?[cx+sign*reach,top+.07+height,cz+sign*.045*Math.cos(ang)]:[cx+sign*.045*Math.cos(ang),top+.07+height,cz+sign*reach];addRibbon(p,n)}}for(let tail=0;tail<2;tail++)for(let n=0;n<170;n++){const t=n/169,dir=tail===0?1:-1;addRibbon([cx+dir*t*w*.35,top+.05-t*t*.15,cz+dir*t*d*.13],n)}}return a}
function makeGround(){const r=rng(c.seed+6),a=[];for(let i=0;i<c.ground.rings;i++){const rad=c.ground.radius*(i+1)/c.ground.rings;for(let j=0;j<c.ground.pointsPerRing;j++){const angle=TAU*j/c.ground.pointsPerRing;a.push({p:[Math.cos(angle)*rad,.02,Math.sin(angle)*rad],color:0x30384c,birth:0,size:.38,phase:r()*TAU})}}return a}

const vert='attribute float aBirth;attribute float aSize;attribute float aPhase;varying vec3 vColor;varying float vBirth;varying float vPhase;uniform float uTime;uniform float uPixel;void main(){vColor=color;vBirth=aBirth;vPhase=aPhase;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=min(20.0,max(1.0,aSize*uPixel*14.0/max(1.0,-mv.z)));}',frag='uniform float uTime;uniform float uGlow;varying vec3 vColor;varying float vBirth;varying float vPhase;void main(){float age=uTime-vBirth;if(age<0.0)discard;vec2 uv=gl_PointCoord-vec2(0.5);float d=length(uv);float core=smoothstep(0.48,0.06,d);float halo=exp(-d*d*15.0);float twinkle=0.82+0.18*sin(uTime*2.6+vPhase);float reveal=smoothstep(0.0,0.65,age);float alpha=mix(core,halo,uGlow)*twinkle*reveal;if(alpha<0.03)discard;gl_FragColor=vec4(vColor*(0.84+0.16*twinkle),alpha);}';

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setClearColor(c.background,1);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(c.camera.fov,innerWidth/innerHeight,.1,100);camera.position.set(...c.camera.position);camera.lookAt(...c.camera.target);const treeGroup=new THREE.Group();scene.add(treeGroup);const systems=[];function add(data,parent=treeGroup,glow=false){const p=createParticles(data,glow);parent.add(p);systems.push(p);return p}add(makeGround(),scene);add(makeTree());add(makeRibbon(),treeGroup,true);add(makeLights(),treeGroup,true);add(makeOrnaments());add(makeStar(),treeGroup,true);add(makeGifts());const snow=add(makeSnow(),scene,true),snowOriginal=snow.geometry.attributes.position.array.slice(),clock=new THREE.Clock();let time=0,playing=true,speed=1;const speedButtons=[...document.querySelectorAll('.speed-button')];for(const button of speedButtons)button.addEventListener('click',()=>{speed=Number(button.dataset.speed);for(const other of speedButtons)other.setAttribute('aria-pressed',String(other===button))});function update(dt){if(playing){time=(time+dt*speed)%c.duration}treeGroup.rotation.y=(c.motion.startDegrees+c.motion.rotationDegreesPerSecond*c.motion.rotationMultiplier*time)*Math.PI/180;for(const p of systems)p.userData.tick(time);const attr=snow.geometry.attributes.position;for(let i=0;i<c.snow.count;i++){const k=i*3+1;attr.array[k]=((snowOriginal[k]-time*c.snow.speed+.5+c.snow.spreadY*10)%c.snow.spreadY)-.5}attr.needsUpdate=true}function frame(){requestAnimationFrame(frame);update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera)}frame();addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();playing=!playing}});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProject
